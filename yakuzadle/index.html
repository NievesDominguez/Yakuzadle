<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Nishikiyama_daimon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#242424" />
  <title>LADdle</title>

  <!-- Descripción para buscadores y URL canónica -->
  <meta name="description"
    content="A free daily guessing game for Like a Dragon (Yakuza) fans. Guess the mystery character from color-coded clues. A new one every day!" />
  <link rel="canonical" href="https://laddle.web.app/" />

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LADdle" />
  <meta property="og:title" content="LADdle - Daily Like a Dragon guessing game" />
  <meta property="og:description"
    content="Guess the mystery Like a Dragon / Yakuza character from color-coded clues. A new one every day!" />
  <meta property="og:url" content="https://laddle.web.app/" />
  <meta property="og:image" content="https://laddle.web.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="LADdle logo above a grid of green, yellow and red squares" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X usa las etiquetas og de arriba y pide la tarjeta con imagen grande -->
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
